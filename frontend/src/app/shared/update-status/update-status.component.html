<button type="button" class="update-status" [class.available]="engine.releaseUpdate().state === 'available'" [disabled]="engine.status() !== 'ready' || engine.releaseUpdate().state === 'checking'" [title]="title()" (click)="engine.action('release')">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4" /></svg>
  <span aria-live="polite" aria-atomic="true">{{ label() }}</span>
  @if (engine.releaseUpdate().state === 'available') { <span class="update-dot" aria-hidden="true"></span> }
</button>
