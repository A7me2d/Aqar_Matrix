name: Publish Windows release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v10.80.63'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            alaa-deals-app/package-lock.json
            frontend/package-lock.json
      - name: Select release version
        id: release
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          $pattern = '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          $appVersion = [version](Get-Content alaa-deals-app/package.json -Raw | ConvertFrom-Json).version
          $tag = $env:REQUESTED_TAG
          if ($tag) {
            if ($tag -cnotmatch $pattern) { throw 'Expected a stable version tag such as v10.80.69.' }
            git rev-parse --verify "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'The requested tag does not exist.' }
          } else {
            # Reuse the same version when retrying a published/tagged commit.
            $tag = @(git tag --points-at HEAD | Where-Object { $_ -cmatch $pattern } |
              Sort-Object { [version]$_.Substring(1) } -Descending) | Select-Object -First 1
            if (!$tag) {
              $latest = @(git tag --list | Where-Object { $_ -cmatch $pattern } |
                ForEach-Object { [version]$_.Substring(1) } | Sort-Object -Descending) | Select-Object -First 1
              $next = $appVersion
              if ($latest -and $next -le $latest) {
                $next = [version]::new($latest.Major, $latest.Minor, $latest.Build + 1)
              }
              $tag = "v$next"
            }
          }
          # The release tag is authoritative; keep source version files untouched
          # on main and stamp both manifests only in this packaging workspace.
          $version = $tag.Substring(1)
          Push-Location alaa-deals-app
          npm version $version --no-git-tag-version --allow-same-version --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Could not stamp the release version.' }
          Pop-Location
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Install application dependencies
        working-directory: alaa-deals-app
        run: npm ci
      - name: Download packaged FFmpeg binary
        working-directory: alaa-deals-app
        run: node node_modules/ffmpeg-static/install.js
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Prepare page assets
        working-directory: alaa-deals-app
        run: npm run build:posts
      - name: Package the Angular interface
        working-directory: alaa-deals-app
        run: npm run build:ui
      - name: Package Windows installer and portable application
        working-directory: alaa-deals-app
        run: npm run dist
      - name: Publish release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $appVersion = (Get-Content alaa-deals-app/package.json -Raw | ConvertFrom-Json).version
          $installer = "alaa-deals-app/dist/AqarMatrix-Setup-$appVersion.exe"
          $portable = "alaa-deals-app/dist/AqarMatrix-Portable-$appVersion.exe"
          $metadata = 'alaa-deals-app/dist/latest.yml'
          foreach ($artifact in @($installer, $portable, $metadata)) {
            if (!(Test-Path -LiteralPath $artifact)) { throw "Missing release file: $artifact" }
          }
          $assets = @($installer, $portable, $metadata)
          $assets += @(Get-ChildItem -LiteralPath alaa-deals-app/dist -Filter '*.blockmap' -File | ForEach-Object { $_.FullName })
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            git tag $env:RELEASE_TAG $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release tag.' }
            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Could not push the release tag.' }
          }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "Aqar Matrix $appVersion" --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
