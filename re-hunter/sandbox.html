<style>

.aq-in:focus,.aq-btn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

<body>
<div id="aq-err" role="alert"></div>

<script>
(function () {
  "use strict";
  var HOST = window.parent, seq = 0, pend = new Map(), outstanding = 0, changeCbs = [], inited = false, dry = false, finished = false;
  var rep = { errors: [], logs: [], clicked: [], calls: [] };
  var root = document.getElementById("aq-root"), errBox = document.getElementById("aq-err");
  var post = function (m) { m.aq = 1; try { HOST.postMessage(m, "*"); return true; } catch (e) { return false; } };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var short = function (x, n) { x = String(x == null ? "" : x); return x.length > n ? x.slice(0, n) + "…" : x; };

  // ---------- أخطاء ----------
  function reportError(e) {
    var msg = short(e && e.message ? e.message : e, 300);
    if (rep.errors.length < 10 && rep.errors.indexOf(msg) < 0) rep.errors.push(msg);
    errBox.textContent = "حصل خطأ في الأداة: " + msg; errBox.style.display = "block";
    post({ t: "err", msg: msg });
  }
  window.addEventListener("error", function (ev) { reportError(ev.error || ev.message); });
  window.addEventListener("unhandledrejection", function (ev) { reportError(ev.reason); });
  ["log", "info", "warn", "error"].forEach(function (lv) {
    var o = console[lv] ? console[lv].bind(console) : function () {};

      var a = Array.prototype.slice.call(arguments).map(function (x) { try { return typeof x === "string" ? x : JSON.stringify(x); } catch (e) { return String(x); } }).join(" ");
      if (rep.logs.length < 30) rep.logs.push(lv + ": " + short(a, 240));
      o.apply(null, arguments);
    };
  });

  // ---------- حارس الحلقات (بيستدعيه الكود اللي اتعدّل بواسطة aiguard.js): حلقة أكتر من 3 ثواني من غير توقف = خطأ بدل تعليق البرنامج ----------
  var lgN = 0, lgPend = false, lgT0 = 0, lgDead = false, LGMSG = "الأداة اشتغلت أكتر من 3 ثواني من غير توقف (غالباً حلقة مالهاش نهاية) — اتأكد من شرط الخروج";
  Object.defineProperty(window, "__lg", { value: function () {
    if (lgDead) throw new Error(LGMSG);
    if ((++lgN & 2047) !== 0) return;
    var now = performance.now();
    if (!lgPend) { lgPend = true; lgT0 = now; setTimeout(function () { lgPend = false; }, 0); }
    else if (now - lgT0 > 3000) { lgDead = true; throw new Error(LGMSG); }
  }, writable: false, configurable: false });

  // ---------- جسر RPC ----------
  function rpc(m, a, timeout) {
    return new Promise(function (res, rej) {
      var id = ++seq; outstanding++;
      var t = setTimeout(function () { if (pend.delete(id)) { outstanding--; rej(new Error("انتهت مهلة الطلب: " + m)); } }, timeout || 60000);
      pend.set(id, {
        res: function (v) { clearTimeout(t); outstanding--; res(v); },
        rej: function (e) { clearTimeout(t); outstanding--; rej(new Error(e || "فشل")); }
      });
      if (rep.calls.length < 60) rep.calls.push(m);
      if (!post({ t: "call", id: id, m: m, a: a })) { clearTimeout(t); pend.delete(id); outstanding--; rej(new Error("البيانات اللي بعتّها مش مسموحة (دوال أو كائنات معقدة)")); }
    });
  }
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var fmt = {
    num: function (n) { n = Number(n); return isFinite(n) ? n.toLocaleString("en-US") : "—"; },
    money: function (n) {
      n = Number(n); if (!isFinite(n) || !n) return "—";
      if (n >= 1e6) { var m = Math.round(n / 1e4) / 100; return String(m).replace(/\.0+$/, "") + " مليون"; }
      if (n >= 1e3) { var k = Math.round(n / 1e3); return k >= 1000 ? "1 مليون" : k + " ألف"; }
      return String(Math.round(n));
    },
    date: function (ts) { try { return new Date(+ts).toLocaleDateString("ar-EG-u-nu-latn", { year: "numeric", month: "short", day: "numeric" }); } catch (e) { return "—"; } },
    ago: function (d) { d = Number(d); if (!isFinite(d)) return "—"; if (d < 1) return "النهارده"; if (d < 2) return "امبارح"; if (d < 30) return "من " + Math.round(d) + " يوم"; if (d < 365) return "من " + Math.round(d / 30) + " شهر"; return "من أكتر من سنة"; }
  };
  var Aqar = {
    posts: function (f) { return rpc("posts", [f || {}]); },
    stats: function (f) { return rpc("stats", [f || {}]); },
    leads: function (f) { return rpc("leads", [f || {}]); },
    sellers: function (f) { return rpc("sellers", [f || {}]); },
    slots: function () { return rpc("slots", []); },
    passport: function (t) { return rpc("passport", [String(t == null ? "" : t)]); },
    settings: function () { return rpc("settings", []); },
    store: {
      get: function (k, d) { return rpc("store.get", [String(k)]).then(function (v) { return v === undefined || v === null ? d : v; }); },
      set: function (k, v) { return rpc("store.set", [String(k), v]); },
      remove: function (k) { return rpc("store.remove", [String(k)]); },
      keys: function () { return rpc("store.keys", []); }
    },
    addSlot: function (s) { return rpc("addSlot", [s], 600000); },
    removeSlot: function (id) { return rpc("removeSlot", [String(id)], 600000); },
    csv: function (name, rows) { return rpc("csv", [String(name), rows], 600000); },
    link: function (u) { return rpc("link", [String(u), !!(navigator.userActivation && navigator.userActivation.isActive)]); },
    copy: function (t) { return rpc("copy", [String(t == null ? "" : t)]); },
    toast: function (m) { post({ t: "toast", msg: short(m, 200) }); },
    onChange: function (fn) { if (typeof fn === "function") changeCbs.push(fn); },
    esc: esc, fmt: fmt

  window.alert = function (m) { Aqar.toast(m); };
  window.confirm = function () { return false; };
  window.prompt = function () { return null; };
  window.open = function () { Aqar.toast("فتح نوافذ ممنوع — استخدم Aqar.link"); return null; };

  // ---------- حراسة الـDOM: أي عنصر ممكن يسرّب أو يفتح صفحة بيتشال ----------
  var BAD = "link,meta,base,iframe,frame,frameset,object,embed,applet,portal";
  function sweep(n) {
    if (!n || n.nodeType !== 1) return;
    if (n.matches && n.matches(BAD)) { rep.logs.push("removed <" + n.localName + ">"); n.remove(); return; }

  // ---------- شكل ----------
  function applyTheme(vars, dark) {
    var st = document.documentElement.style;
    if (vars) for (var k in vars) if (/^--[a-z0-9-]{1,24}$/.test(k) && typeof vars[k] === "string" && vars[k].length < 80 && !/[;{}<>]|url\(|expression/i.test(vars[k])) st.setProperty(k, vars[k]);

  }
  var lastH = 0;
  new ResizeObserver(function () { var de = document.documentElement; if (!de) return; var h = Math.ceil(de.scrollHeight); if (Math.abs(h - lastH) > 1) { lastH = h; post({ t: "size", h: h }); } }).observe(document.body);

  // ---------- تشغيل الأداة ----------
  function startTool(t) {
    document.getElementById("tool-css").textContent = String(t.css || "");
    root.innerHTML = String(t.html || "");
    var p;
    try {
      var fn = new Function("Aqar", "'use strict';return (async()=>{\n" + String(t.js || "") + "\n})()");
      p = Promise.resolve(fn(Aqar));
    } catch (e) { reportError(e); p = Promise.resolve(); }
    return p.catch(reportError);
  }

  // ---------- تجربة جافة (للتأكد إن الأداة شغالة قبل ما المستخدم يشوفها) ----------
  function visible(el) { var r = el.getBoundingClientRect(); var cs = getComputedStyle(el); return !el.disabled && cs.display !== "none" && cs.visibility !== "hidden" && (r.width > 0 || r.height > 0); }
  function domSummary() {
    var text = (root.innerText || "").replace(/\s+/g, " ").trim();
    var q = function (s) { return root.querySelectorAll(s).length; };
    return { text: short(text, 700), chars: text.length, buttons: q("button,.aq-btn,[role=button]"), inputs: q("input,select,textarea"), tables: q("table"), rows: q("tr"), items: q("li"),
      empty: !text && !q("canvas,svg,img,input,select,textarea"), badText: /\bNaN\b|\bundefined\b|\[object Object\]|\bnull\b/.test(text),

  }
  async function settle(ms) { var end = Date.now() + (ms || 2500); await sleep(120); while (outstanding > 0 && Date.now() < end) await sleep(60); await sleep(80); }
  function finish() {
    if (finished) return; finished = true;
    post({ t: "report", rep: { errors: rep.errors.slice(0, 10), logs: rep.logs.slice(0, 20), clicked: rep.clicked, calls: rep.calls.slice(0, 40), dom: domSummary(), domInitial: window.__dom0 || null } });
  }
  async function dryFlow() {
    await settle(3500);
    window.__dom0 = domSummary();
    var fields = Array.prototype.slice.call(root.querySelectorAll("input,textarea,select")).filter(visible).slice(0, 12);
    fields.forEach(function (f) {
      try {
        var ty = (f.getAttribute("type") || "text").toLowerCase();
        if (f.tagName === "SELECT") { if (f.options.length > 1 && f.selectedIndex < 1) f.selectedIndex = 1; }
        else if (ty === "checkbox" || ty === "radio") return;
        else if (!f.value) f.value = ty === "number" ? "100" : ty === "date" ? "2026-01-15" : "اختبار";
        f.dispatchEvent(new Event("input", { bubbles: true })); f.dispatchEvent(new Event("change", { bubbles: true }));
      } catch (e) { reportError(e); }
    });
    await settle(1500);
    var btns = Array.prototype.slice.call(root.querySelectorAll("button,.aq-btn,[role=button]")).filter(visible).slice(0, 12);
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i]; if (!document.contains(b)) continue;

  }

  window.addEventListener("message", function (ev) {
    if (ev.source !== HOST) return;
    var d = ev.data; if (!d || d.aq !== 1) return;
    if (d.t === "init") {

    } else if (d.t === "theme") applyTheme(d.vars, d.dark);

</script>
